[pytest]
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

testpaths = tests

markers =
    api: API tests (REST or GraphQL)
    rest: REST API tests
    graphql: GraphQL API tests
    web: Web UI tests
    mobile: Mobile UI tests
    android: Android mobile tests
    ios: iOS mobile tests
    db: Database tests
    integration: Integration tests
    smoke: Fast smoke tests against mock API/web only
    smoke_db: Smoke tests requiring database
    smoke_e2e: End-to-end smoke tests requiring API, DB, and web
    smoke_mobile: Mobile smoke tests requiring Appium
    regression: Regression test suite
    e2e: End-to-end tests
    slow: Slow running tests

addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=reports/allure-results
    --clean-alluredir
    --log-cli-level=INFO

timeout = 300
minversion = 3.8
